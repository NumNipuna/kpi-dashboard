<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMO Chicken & Agro - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Colors */
        :root {
            --c-900: #03045E;
            --c-800: #023E8A;
            --c-700: #0077B6;
            --c-600: #0096C7;
            --c-500: #00B4D8;
            --c-400: #48CAE4;
            --c-300: #90E0EF;
            --c-200: #ADE8F4;
            --c-100: #CAF0F8;
        }

        body {
            background: linear-gradient(135deg, var(--c-900), var(--c-800));
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Target Badges */
        .badge-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #4ade80; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; }

        /* Wheel UI - Fixes Applied Here */
        .wheel-container {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 500px;
            height: 800px;
            pointer-events: none; /* Let clicks pass through empty container */
            z-index: 40; /* Keep below header but above main card */
        }

        .wheel {
            position: absolute;
            top: 50%;
            left: -350px; 
            width: 700px;
            height: 700px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.15);
            transform: translateY(-50%) rotate(0deg);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none; /* Fix: Prevent invisible wheel from blocking clicks */
        }

        .wheel-item {
            position: absolute;
            width: 80px;
            height: 80px;
            background: var(--c-700);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 2px solid var(--c-400);
            transition: all 0.3s ease;
            margin-top: -40px; 
            margin-left: -40px; 
            z-index: 50;
            pointer-events: auto; /* Fix: Only the buttons are clickable */
        }

        .wheel-item:hover, .wheel-item.active {
            background: var(--c-400);
            color: var(--c-900);
            transform: scale(1.15);
            box-shadow: 0 0 25px var(--c-400);
        }

        /* Main Card Animations */
        .main-card-container {
            opacity: 0;
            transform: scale(0.9) translateX(30px);
            transition: all 0.5s ease-out;
        }

        .main-card-container.active {
            opacity: 1;
            transform: scale(1) translateX(0);
        }

        /* Dropdown Styling */
        select {
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid var(--c-400);
            border-radius: 8px;
            padding: 8px 16px;
            outline: none;
            cursor: pointer;
        }
        select option { background-color: var(--c-900); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="w-full p-6 flex justify-between items-center z-50 relative">
        <div class="flex items-center space-x-4">
            <!-- Root directory eke thiyena logo.png -->
            <img src="logo.png" alt="IMO Logo" class="h-12 w-auto object-contain" onerror="this.style.display='none'">
            <div>
                <h1 class="text-2xl font-bold tracking-wider" style="color: var(--c-100);">IMO Chicken & Agro</h1>
                <p class="text-xs tracking-widest uppercase" style="color: var(--c-400);">Performance Dashboard</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-4 glass px-6 py-3 rounded-full">
            <span class="text-sm font-semibold" style="color: var(--c-200);">Period:</span>
            <select id="monthFilter" onchange="filterData()">
                <option value="all">Loading Data...</option>
            </select>
        </div>
    </header>

    <!-- Wheel Navigation -->
    <div class="wheel-container">
        <div class="wheel" id="kpiWheel">
            <div class="wheel-item" data-angle="-75" data-kpi="1" onclick="selectKPI(1, this)">SRR%</div>
            <div class="wheel-item" data-angle="-45" data-kpi="2" onclick="selectKPI(2, this)">ShRR%</div>
            <div class="wheel-item" data-angle="-15" data-kpi="3" onclick="selectKPI(3, this)">SFA%</div>
            <div class="wheel-item" data-angle="15" data-kpi="4" onclick="selectKPI(4, this)">KPI 4</div>
            <div class="wheel-item" data-angle="45" data-kpi="5" onclick="selectKPI(5, this)">KPI 5</div>
            <div class="wheel-item" data-angle="75" data-kpi="6" onclick="selectKPI(6, this)">KPI 6</div>
        </div>
    </div>

    <!-- Main Content Display -->
    <main class="flex-1 flex items-center justify-center pl-40 md:pl-64 p-8 z-10 relative">
        <div id="mainDisplay" class="main-card-container glass w-full max-w-4xl rounded-[2rem] p-12 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-96 h-96 rounded-full opacity-10 -mr-32 -mt-32 blur-3xl" style="background: var(--c-400);"></div>
            
            <div class="relative z-10">
                <div class="flex flex-col md:flex-row md:justify-between md:items-start mb-2">
                    <h2 id="kpiTitle" class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 md:mb-0" style="color: var(--c-100);">Loading...</h2>
                    <div id="targetBadge" class="px-4 py-2 rounded-full text-sm font-bold tracking-wider hidden self-start">Target</div>
                </div>
                <p id="kpiDescription" class="text-lg mb-10 opacity-80" style="color: var(--c-200);">Please wait while data is being prepared.</p>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <!-- Main Value -->
                    <div class="col-span-1 md:col-span-1 p-8 rounded-3xl glass border-t-4 flex flex-col justify-center items-center text-center" style="border-color: var(--c-400);">
                        <p id="mainMetricLabel" class="text-sm font-semibold uppercase tracking-widest mb-2" style="color: var(--c-300);">Rate</p>
                        <p id="mainMetricValue" class="text-5xl md:text-6xl font-black" style="color: var(--c-100);">0%</p>
                    </div>
                    
                    <!-- Sub Values -->
                    <div class="col-span-1 md:col-span-2 flex flex-col justify-center space-y-6 md:pl-8">
                        <div class="glass p-5 rounded-2xl">
                            <p id="subMetric1Label" class="text-xs uppercase tracking-wider opacity-70 mb-1" style="color: var(--c-200);">Metric 1</p>
                            <p id="subMetric1Value" class="text-3xl font-bold" style="color: var(--c-100);">0</p>
                        </div>
                        <div class="glass p-5 rounded-2xl">
                            <p id="subMetric2Label" class="text-xs uppercase tracking-wider opacity-70 mb-1" style="color: var(--c-200);">Metric 2</p>
                            <p id="subMetric2Value" class="text-3xl font-bold" style="color: var(--c-100);">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Google Sheets Data Sources
        const URL_SALES_RETURN = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhXYa1mHKdqGCAI5xwLIZG62RUsnUVlE9V93tXkzBjWaFZ1Gwhyz0vJRrMgUFwaZ0zzNGGMZkeP9jd/pub?gid=287547461&single=true&output=csv';
        const URL_ISSUED_QTY   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhXYa1mHKdqGCAI5xwLIZG62RUsnUVlE9V93tXkzBjWaFZ1Gwhyz0vJRrMgUFwaZ0zzNGGMZkeP9jd/pub?gid=957766558&single=true&output=csv';
        const URL_SHOP_RETURN  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhXYa1mHKdqGCAI5xwLIZG62RUsnUVlE9V93tXkzBjWaFZ1Gwhyz0vJRrMgUFwaZ0zzNGGMZkeP9jd/pub?gid=856858213&single=true&output=csv';
        const URL_REP_REPORT   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhXYa1mHKdqGCAI5xwLIZG62RUsnUVlE9V93tXkzBjWaFZ1Gwhyz0vJRrMgUFwaZ0zzNGGMZkeP9jd/pub?gid=87908764&single=true&output=csv';
        const URL_FORECAST     = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTXCD67RZNeYMDswTAZeNWu5WtFw3AbnaeovL5c_QWenvhyhKdtM_BjlLWrkC3HHeCmbswionYky09m/pub?gid=1755458034&single=true&output=csv';

        let gData = { salesReturn: [], issuedQty: [], shopReturn: [], repReport: [], forecast: [] };
        let activeKPI = 1;

        // Positioning the wheel items mathematically
        const wheelRadius = 350; 
        document.querySelectorAll('.wheel-item').forEach(item => {
            const angleDeg = parseFloat(item.getAttribute('data-angle'));
            const angleRad = angleDeg * (Math.PI / 180);
            const x = Math.cos(angleRad) * wheelRadius;
            const y = Math.sin(angleRad) * wheelRadius;
            item.style.transform = `translate(${x}px, ${y}px) rotate(${-angleDeg}deg)`;
            item.dataset.baseTransform = `translate(${x}px, ${y}px)`; 
        });

        // Advanced CSV Parser (Bypasses commas inside numbers like "11,588.45")
        function parseCSVAdvanced(str) {
            const result = [];
            const lines = str.split('\n');
            for(let line of lines) {
                if(!line.trim()) continue;
                let arr = [];
                let inQuotes = false;
                let val = '';
                for(let i=0; i<line.length; i++) {
                    let char = line[i];
                    if(char === '"' && line[i+1] === '"') { val += '"'; i++; } 
                    else if(char === '"') { inQuotes = !inQuotes; }
                    else if(char === ',' && !inQuotes) { arr.push(val); val = ''; }
                    else { val += char; }
                }
                arr.push(val);
                result.push(arr.map(v => v.trim().replace(/^"|"$/g, '').replace(/,/g, ''))); 
            }
            return result.slice(1); // Exclude Header Row
        }

        // Extracts YYYY-Month from various Date string formats
        function getYMFromDateStr(dStr) {
            if(!dStr) return "";
            let d = new Date(dStr);
            if(isNaN(d) && dStr.includes('/')) {
                let p = dStr.split(/[/-]/);
                if(p.length === 3) d = new Date(`${p[2]}-${p[1]}-${p[0]}`); // Try DD/MM/YYYY
            }
            if(!isNaN(d)) {
                return `${d.getFullYear()}-${d.toLocaleString('default', { month: 'long' })}`;
            }
            return "";
        }

        // Fetch all Data initially
        async function initData() {
            try {
                const ts = '&t=' + new Date().getTime();
                const [resSR, resIQ, resShR, resRR, resFc] = await Promise.all([
                    fetch(URL_SALES_RETURN + ts),
                    fetch(URL_ISSUED_QTY + ts),
                    fetch(URL_SHOP_RETURN + ts),
                    fetch(URL_REP_REPORT + ts),
                    fetch(URL_FORECAST + ts)
                ]);

                gData.salesReturn = parseCSVAdvanced(await resSR.text());
                gData.issuedQty   = parseCSVAdvanced(await resIQ.text());
                gData.shopReturn  = parseCSVAdvanced(await resShR.text());
                gData.repReport   = parseCSVAdvanced(await resRR.text());
                gData.forecast    = parseCSVAdvanced(await resFc.text());

                // Populate the Dropdown Filter
                const monthSet = new Set();
                [gData.salesReturn, gData.issuedQty, gData.shopReturn, gData.forecast].forEach(dataset => {
                    dataset.forEach(row => { if(row[0] && row[1]) monthSet.add(`${row[0]}-${row[1]}`.trim()); });
                });
                gData.repReport.forEach(row => {
                    let ym = getYMFromDateStr(row[0]);
                    if(ym) monthSet.add(ym);
                });

                const filter = document.getElementById('monthFilter');
                filter.innerHTML = ''; 
                const sortedMonths = Array.from(monthSet).sort((a,b) => b.localeCompare(a)); 
                
                if(sortedMonths.length === 0) {
                    filter.innerHTML = '<option value="">No Data Found</option>';
                    return;
                }

                sortedMonths.forEach(ym => {
                    const opt = document.createElement('option');
                    opt.value = ym;
                    opt.textContent = ym.replace('-', ' ');
                    filter.appendChild(opt);
                });

                // Trigger first KPI automatically once data is loaded
                selectKPI(1, document.querySelector('.wheel-item[data-kpi="1"]'));

            } catch (error) {
                console.error("Data fetch error", error);
                document.getElementById('kpiTitle').innerText = "Connection Error!";
                document.getElementById('kpiDescription').innerText = "Please check your internet or Google Sheet links.";
            }
        }

        // Set the Target Badge (Green/Red)
        function setTargetBadge(isSuccess, text) {
            const badge = document.getElementById('targetBadge');
            badge.style.display = 'block';
            badge.innerText = text;
            if(isSuccess) {
                badge.className = "px-4 py-2 rounded-full text-sm font-bold tracking-wider badge-success";
            } else {
                badge.className = "px-4 py-2 rounded-full text-sm font-bold tracking-wider badge-danger";
            }
        }

        // Filter Triggered by Dropdown
        function filterData() {
            const ym = document.getElementById('monthFilter').value;
            if(!ym) return;

            if(activeKPI === 1) calculateSRR(ym);
            else if(activeKPI === 2) calculateShRR(ym);
            else if(activeKPI === 3) calculateSFA(ym);
        }

        // --- KPI 1: Sales Return Rate ---
        function calculateSRR(ym) {
            let totalIssue = 0, totalReturn = 0;

            gData.issuedQty.forEach(r => { if(`${r[0]}-${r[1]}` === ym) totalIssue += parseFloat(r[3]) || 0; });
            gData.salesReturn.forEach(r => { if(`${r[0]}-${r[1]}` === ym) totalReturn += parseFloat(r[3]) || 0; });

            const rate = totalIssue > 0 ? ((totalReturn / totalIssue) * 100) : 0;

            document.getElementById('mainMetricValue').innerText = rate.toFixed(2) + '%';
            document.getElementById('subMetric1Label').innerText = "Total Issued Qty";
            document.getElementById('subMetric1Value').innerText = totalIssue.toLocaleString();
            document.getElementById('subMetric2Label').innerText = "Total Return Qty";
            document.getElementById('subMetric2Value').innerText = totalReturn.toLocaleString();

            setTargetBadge(rate < 4, `Target: < 4% | Actual: ${rate.toFixed(2)}%`);
        }

        // --- KPI 2: Shop Return Rate ---
        function calculateShRR(ym) {
            let totalShopReturn = 0, totalSold = 0;

            gData.shopReturn.forEach(r => { if(`${r[0]}-${r[1]}` === ym) totalShopReturn += parseFloat(r[3]) || 0; });
            gData.repReport.forEach(r => { if(getYMFromDateStr(r[0]) === ym) totalSold += parseFloat(r[7]) || 0; });

            const rate = totalSold > 0 ? ((totalShopReturn / totalSold) * 100) : 0;

            document.getElementById('mainMetricValue').innerText = rate.toFixed(2) + '%';
            document.getElementById('subMetric1Label').innerText = "Total Sold Qty";
            document.getElementById('subMetric1Value').innerText = totalSold.toLocaleString(undefined, {maximumFractionDigits: 2});
            document.getElementById('subMetric2Label').innerText = "Shop Return Qty";
            document.getElementById('subMetric2Value').innerText = totalShopReturn.toLocaleString(undefined, {maximumFractionDigits: 2});

            setTargetBadge(rate < 1, `Target: < 1% | Actual: ${rate.toFixed(2)}%`);
        }

        // --- KPI 3: Sales Forecast Accuracy ---
        function calculateSFA(ym) {
            let totalForecast = 0, totalSold = 0;

            gData.forecast.forEach(r => { if(`${r[0]}-${r[1]}` === ym) totalForecast += parseFloat(r[4]) || 0; });
            gData.repReport.forEach(r => { if(getYMFromDateStr(r[0]) === ym) totalSold += parseFloat(r[7]) || 0; });

            let accuracy = 0;
            if (totalSold > 0) {
                accuracy = (1 - (Math.abs(totalSold - totalForecast) / totalSold)) * 100;
            }

            document.getElementById('mainMetricValue').innerText = accuracy.toFixed(2) + '%';
            document.getElementById('subMetric1Label').innerText = "Actual Sales (Sold Qty)";
            document.getElementById('subMetric1Value').innerText = totalSold.toLocaleString(undefined, {maximumFractionDigits: 2});
            document.getElementById('subMetric2Label').innerText = "Forecast Sales";
            document.getElementById('subMetric2Value').innerText = totalForecast.toLocaleString(undefined, {maximumFractionDigits: 2});

            setTargetBadge(accuracy > 98, `Target: > 98% | Actual: ${accuracy.toFixed(2)}%`);
        }

        // --- Wheel Click & Animation Logic ---
        function selectKPI(id, element) {
            activeKPI = id;

            // Remove active state from all
            document.querySelectorAll('.wheel-item').forEach(el => {
                el.classList.remove('active');
                el.style.transform = el.dataset.baseTransform + ` rotate(${document.getElementById('kpiWheel').dataset.currentRotation || 0}deg)`; 
            });
            
            // Add active to clicked item
            element.classList.add('active');
            
            // Spin the wheel
            const angleToRotate = -parseFloat(element.getAttribute('data-angle'));
            const wheel = document.getElementById('kpiWheel');
            wheel.style.transform = `translateY(-50%) rotate(${angleToRotate}deg)`;
            wheel.dataset.currentRotation = angleToRotate; 

            // Counter-rotate items so text stays upright
            document.querySelectorAll('.wheel-item').forEach(el => {
                const originalAngle = parseFloat(el.getAttribute('data-angle'));
                el.style.transform = el.dataset.baseTransform + ` rotate(${-(angleToRotate + originalAngle)}deg)`;
                if(el.classList.contains('active')) el.style.transform += ' scale(1.15)'; // Pop effect
            });

            // Morph Animation for Main Card
            const mainCard = document.getElementById('mainDisplay');
            mainCard.classList.remove('active'); // Fade out
            
            setTimeout(() => {
                const badge = document.getElementById('targetBadge');
                
                if(id === 1) {
                    document.getElementById('kpiTitle').innerText = "Sales Return Rate";
                    document.getElementById('kpiDescription').innerText = "Percentage of products returned compared to products issued.";
                    document.getElementById('mainMetricLabel').innerText = "Rate";
                    filterData(); 
                } else if(id === 2) {
                    document.getElementById('kpiTitle').innerText = "Shop Return Rate";
                    document.getElementById('kpiDescription').innerText = "Percentage of shop returns compared to total sold quantity.";
                    document.getElementById('mainMetricLabel').innerText = "Rate";
                    filterData();
                } else if (id === 3) {
                    document.getElementById('kpiTitle').innerText = "Sales Forecast Accuracy";
                    document.getElementById('kpiDescription').innerText = "How close actual sales are matching the forecast predictions.";
                    document.getElementById('mainMetricLabel').innerText = "Accuracy";
                    filterData();
                } else {
                    // KPI 4, 5, 6
                    document.getElementById('kpiTitle').innerText = `KPI ${id} (Under Construction)`;
                    document.getElementById('kpiDescription').innerText = "Details for this metric will be available soon.";
                    document.getElementById('mainMetricLabel').innerText = "N/A";
                    document.getElementById('mainMetricValue').innerText = "-";
                    document.getElementById('subMetric1Label').innerText = "Metric 1";
                    document.getElementById('subMetric1Value').innerText = "-";
                    document.getElementById('subMetric2Label').innerText = "Metric 2";
                    document.getElementById('subMetric2Value').innerText = "-";
                    badge.style.display = 'none'; // Hide target badge
                }
                mainCard.classList.add('active'); // Fade in
            }, 400); 
        }

        // Start App
        initData();
        
        // Auto Update Every 15 Seconds
        setInterval(initData, 15000); 

    </script>
</body>
</html>
