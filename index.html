<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Performance Dashboard</title>
    
    <!-- Chart.js for smooth line graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        :root {
            --c-900: #03045E;
            --c-800: #023E8A;
            --c-700: #0077B6;
            --c-600: #0096C7;
            --c-500: #00B4D8;
            --c-400: #48CAE4;
            --c-300: #90E0EF;
            --c-200: #ADE8F4;
            --c-100: #CAF0F8;
        }

        body {
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden; 
            margin: 0;
            background-color: var(--c-900);
        }

        /* Smooth Background Transitions */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; 
        }
        .bg-layer.active {
            opacity: 1;
        }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Status Badges */
        .badge-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #4ade80; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; }

        /* Sidebar Styling */
        .sidebar-menu {
            position: fixed;
            top: 50%;
            left: 20px; 
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px; 
            z-index: 40; 
        }

        .menu-item {
            width: 150px;
            padding: 12px 0;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 50px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 2px solid var(--c-500);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            color: white;
            position: relative;
        }

        .menu-item:hover, .menu-item.active {
            background: white;
            color: var(--c-900);
            transform: scale(1.1) translateX(15px); 
            box-shadow: 0 0 25px var(--c-400);
            border-color: white;
        }

        /* Card Animations (Both KPI and Graph) */
        .card-animate {
            opacity: 0;
            transform: scale(0.95) translateY(20px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-animate.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        select {
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid var(--c-500);
            border-radius: 8px;
            padding: 8px 16px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        select:hover { border-color: var(--c-300); }
        select option { background-color: var(--c-900); }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <!-- Morphing Background Layers -->
    <div id="bg-1" class="bg-layer active" style="background-color: var(--c-900); background-image: radial-gradient(circle at 10% 10%, var(--c-800) 0%, transparent 60%), radial-gradient(circle at 90% 90%, var(--c-700) 0%, transparent 60%);"></div>
    <div id="bg-2" class="bg-layer" style="background-color: var(--c-900); background-image: radial-gradient(circle at 15% 15%, var(--c-700) 0%, transparent 60%), radial-gradient(circle at 85% 85%, var(--c-600) 0%, transparent 60%);"></div>
    <div id="bg-3" class="bg-layer" style="background-color: var(--c-800); background-image: radial-gradient(circle at 5% 20%, var(--c-600) 0%, transparent 65%), radial-gradient(circle at 95% 80%, var(--c-500) 0%, transparent 65%);"></div>
    <div id="bg-4" class="bg-layer" style="background-color: var(--c-800); background-image: radial-gradient(circle at 20% 5%, var(--c-500) 0%, transparent 70%), radial-gradient(circle at 80% 95%, var(--c-400) 0%, transparent 70%);"></div>

    <!-- Header -->
    <header class="w-full p-6 flex justify-between items-center z-50 relative">
        <div id="companyBranding" class="flex items-center space-x-4 transition-all duration-300">
            <div>
                <h1 class="text-2xl font-bold tracking-wider" style="color: var(--c-100);">Live Data Dashboard</h1>
                <p class="text-xs tracking-widest uppercase" style="color: var(--c-300);">KPI Performance Tracker</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-4 ml-auto">
            <div class="flex items-center space-x-4 glass px-6 py-3 rounded-full">
                <span class="text-sm font-semibold" style="color: var(--c-200);">Period:</span>
                <select id="monthFilter" onchange="filterData()">
                    <option value="all">Loading Data...</option>
                </select>
            </div>
            <button onclick="toggleFullScreen()" id="fsBtn" class="glass px-4 py-3 rounded-lg text-sm font-bold text-white hover:bg-white hover:text-black transition cursor-pointer" style="border: 1px solid var(--c-400);">
                ⛶ Full Screen
            </button>
        </div>
    </header>

    <!-- Linear Sidebar Menu -->
    <div class="sidebar-menu" id="kpiMenu">
        <div class="menu-item active" data-kpi="1" onclick="selectKPI(1, this)">Sales Return</div>
        <div class="menu-item" data-kpi="2" onclick="selectKPI(2, this)">Shop Return</div>
        <div class="menu-item" data-kpi="3" onclick="selectKPI(3, this)">Forecast Acc.</div>
        <div class="menu-item" data-kpi="4" onclick="selectKPI(4, this)">Invoice Acc.</div>
    </div>

    <!-- MAIN DISPLAY AREA -->
    <main class="flex-1 flex flex-col lg:flex-row items-stretch justify-center pl-[180px] p-8 z-10 relative gap-6 w-full max-w-[1600px] mx-auto">
        
        <!-- CARD 1: KPI DATA (1/3 Width) -->
        <div id="mainDisplay" class="card-animate glass w-full lg:w-1/3 rounded-[2rem] p-8 relative overflow-hidden flex flex-col justify-between" style="border-top: 5px solid var(--c-500);">
            <div class="absolute top-0 right-0 w-64 h-64 rounded-full opacity-10 -mr-20 -mt-20 blur-3xl bg-white"></div>
            
            <div class="relative z-10">
                <h2 id="kpiTitle" class="text-3xl font-extrabold tracking-tight mb-2" style="color: var(--c-100);">Loading...</h2>
                <div id="targetBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider mb-6 hidden">Target</div>
                
                <p id="kpiDescription" class="text-sm mb-8 opacity-80 text-white">Please wait while data is being fetched.</p>
                
                <div class="flex flex-col space-y-4">
                    <!-- Main Metric -->
                    <div class="p-6 rounded-3xl glass flex flex-col justify-center items-center text-center w-full">
                        <p id="mainMetricLabel" class="text-xs font-semibold uppercase tracking-widest mb-1" style="color: var(--c-300);">Rate</p>
                        <p id="mainMetricValue" class="text-5xl font-black text-white">0%</p>
                    </div>
                    <!-- Sub Metrics -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass p-4 rounded-2xl flex flex-col justify-center text-center">
                            <p id="subMetric1Label" class="text-[10px] uppercase tracking-wider opacity-80 mb-1" style="color: var(--c-200);">Metric 1</p>
                            <p id="subMetric1Value" class="text-xl font-bold text-white">0</p>
                        </div>
                        <div class="glass p-4 rounded-2xl flex flex-col justify-center text-center">
                            <p id="subMetric2Label" class="text-[10px] uppercase tracking-wider opacity-80 mb-1" style="color: var(--c-200);">Metric 2</p>
                            <p id="subMetric2Value" class="text-xl font-bold text-white">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CARD 2: TREND GRAPH (2/3 Width) -->
        <div id="graphDisplay" class="card-animate glass w-full lg:w-2/3 rounded-[2rem] p-8 relative overflow-hidden flex flex-col" style="border-top: 5px solid var(--c-400);">
            <div class="flex justify-between items-center mb-4 relative z-10">
                <h3 id="chartTitle" class="text-xl font-bold tracking-wide" style="color: var(--c-100);">Historical Trend</h3>
                <span class="text-xs opacity-70 glass px-3 py-1 rounded-full" style="color: white;">Monthly View</span>
            </div>
            
            <div class="w-full flex-1 relative min-h-[300px] z-10">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

    </main>

    <script>
        // Oyage ekama Google Sheet CSV link eka
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqjH1DE4bsXNv0WQdrPWM6BlJ03zZRDrOkSBogUElsBWTFbDgl3R4bWnX66EiRvO-10I4ZY6fyWZvH/pub?gid=291083279&single=true&output=csv";

        let parsedData = [];
        let activeKPI = 1;
        let kpiChart = null; 

        const kpiDetails = {
            1: { title: "Sales Return Rate", desc: "Percentage of sales return compared to issued quantity.", target: 4, type: "<" },
            2: { title: "Shop Return Rate", desc: "Percentage of shop return compared to sold quantity.", target: 1, type: "<" },
            3: { title: "Sales Forecast Accuracy", desc: "How accurately the actual sales match the forecast.", target: 98, type: ">" },
            4: { title: "Invoice & Receipt Accuracy", desc: "Accuracy rate of invoices and receipts processed.", target: 99, type: ">" }
        };

        // Initialize and Fetch Data
        function initData() {
            Papa.parse(CSV_URL, {
                download: true,
                header: false,
                complete: function(results) {
                    processCSVData(results.data);
                }
            });
        }

        function processCSVData(rows) {
            parsedData = [];
            const monthFilter = document.getElementById('monthFilter');
            monthFilter.innerHTML = '';

            // Assuming data starts at row 2 (index 2)
            for (let i = 2; i < rows.length; i++) {
                const row = rows[i];
                if (!row[0]) continue; 

                const monthStr = `${row[0]} ${row[1]}`; // e.g. "2026 April"
                
                // Helper to clean numbers and percentages
                const getNum = (val) => {
                    if (!val || val === '-') return null;
                    return parseFloat(val.toString().replace(/,/g, '').replace('%', ''));
                };

                const srrRate = getNum(row[4]);
                const shopRate = getNum(row[7]);
                
                // Skip future empty rows
                if (srrRate === null && shopRate === null) continue;

                parsedData.push({
                    month: monthStr,
                    srr: { rate: srrRate, retQty: getNum(row[2]), issQty: getNum(row[3]) },
                    shop: { rate: shopRate, retQty: getNum(row[5]), soldQty: getNum(row[6]) },
                    forecast: { rate: getNum(row[10]), actual: getNum(row[8]), forecast: getNum(row[9]) },
                    invoice: { rate: getNum(row[13]), incorrect: getNum(row[11]), total: getNum(row[12]) }
                });

                const opt = document.createElement('option');
                opt.value = monthStr;
                opt.textContent = monthStr;
                monthFilter.appendChild(opt);
            }

            // Select latest month by default
            if (parsedData.length > 0) {
                monthFilter.selectedIndex = parsedData.length - 1;
            }

            // Trigger UI update
            selectKPI(1, document.querySelector('.menu-item[data-kpi="1"]'));
        }

        // Set Target Badge Colors dynamically
        function setTargetBadge(val, target, type) {
            const badge = document.getElementById('targetBadge');
            badge.style.display = 'inline-block';
            
            let isSuccess = false;
            if (type === "<") isSuccess = val < target;
            if (type === ">") isSuccess = val > target;

            badge.innerText = `Standard: ${type} ${target}% | Actual: ${val}%`;
            
            if(isSuccess) {
                badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider mb-6 badge-success";
            } else {
                badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider mb-6 badge-danger";
            }
        }

        // Handle KPI Selection
        function selectKPI(id, element) {
            activeKPI = id;

            // Update Background Layers smoothly
            document.querySelectorAll('.bg-layer').forEach(layer => layer.classList.remove('active'));
            document.getElementById(`bg-${id}`).classList.add('active');

            // Update Sidebar UI
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            // Re-trigger Card CSS Animations
            const mainCard = document.getElementById('mainDisplay');
            const graphCard = document.getElementById('graphDisplay');
            mainCard.classList.remove('active'); 
            graphCard.classList.remove('active'); 
            
            setTimeout(() => {
                const kpi = kpiDetails[id];
                document.getElementById('kpiTitle').innerText = kpi.title;
                document.getElementById('kpiDescription').innerText = kpi.desc;
                
                filterData(); // Update data and chart
                
                mainCard.classList.add('active'); 
                graphCard.classList.add('active'); 
            }, 300); 
        }

        // Update Card Data based on Dropdown
        function filterData() {
            const selectedMonth = document.getElementById('monthFilter').value;
            const dataRow = parsedData.find(d => d.month === selectedMonth);
            
            if(!dataRow) return;

            let rate = 0;
            const target = kpiDetails[activeKPI].target;
            const type = kpiDetails[activeKPI].type;

            if (activeKPI === 1) { // SRR
                rate = dataRow.srr.rate || 0;
                document.getElementById('subMetric1Label').innerText = "Issued Qty";
                document.getElementById('subMetric1Value').innerText = (dataRow.srr.issQty || 0).toLocaleString();
                document.getElementById('subMetric2Label').innerText = "Return Qty";
                document.getElementById('subMetric2Value').innerText = (dataRow.srr.retQty || 0).toLocaleString();
            } else if (activeKPI === 2) { // ShRR
                rate = dataRow.shop.rate || 0;
                document.getElementById('subMetric1Label').innerText = "Sold Qty";
                document.getElementById('subMetric1Value').innerText = (dataRow.shop.soldQty || 0).toLocaleString();
                document.getElementById('subMetric2Label').innerText = "Shop Return Qty";
                document.getElementById('subMetric2Value').innerText = (dataRow.shop.retQty || 0).toLocaleString();
            } else if (activeKPI === 3) { // Forecast
                rate = dataRow.forecast.rate || 0;
                document.getElementById('subMetric1Label').innerText = "Actual Sale";
                document.getElementById('subMetric1Value').innerText = (dataRow.forecast.actual || 0).toLocaleString();
                document.getElementById('subMetric2Label').innerText = "Forecast Sale";
                document.getElementById('subMetric2Value').innerText = (dataRow.forecast.forecast || 0).toLocaleString();
            } else if (activeKPI === 4) { // Invoice
                rate = dataRow.invoice.rate || 0;
                document.getElementById('subMetric1Label').innerText = "Incorrect Invoices";
                document.getElementById('subMetric1Value').innerText = (dataRow.invoice.incorrect || 0).toLocaleString();
                document.getElementById('subMetric2Label').innerText = "Total Invoices";
                document.getElementById('subMetric2Value').innerText = (dataRow.invoice.total || 0).toLocaleString();
            }

            document.getElementById('mainMetricValue').innerText = rate.toFixed(2) + '%';
            setTargetBadge(rate.toFixed(2), target, type);
            
            updateTrendChart();
        }

        // Draw the Chart
        function updateTrendChart() {
            // Get data up to the selected month
            const selectedMonth = document.getElementById('monthFilter').value;
            const selectedIndex = parsedData.findIndex(d => d.month === selectedMonth);
            
            // Get last 12 months for the chart
            const trendData = parsedData.slice(Math.max(0, selectedIndex - 11), selectedIndex + 1);

            let labels = [];
            let dataPoints = [];

            trendData.forEach(d => {
                let parts = d.month.split(' ');
                labels.push(`${parts[1].substring(0,3)} '${parts[0].substring(2,4)}`); // "Apr '26"
                
                if (activeKPI === 1) dataPoints.push(d.srr.rate || 0);
                if (activeKPI === 2) dataPoints.push(d.shop.rate || 0);
                if (activeKPI === 3) dataPoints.push(d.forecast.rate || 0);
                if (activeKPI === 4) dataPoints.push(d.invoice.rate || 0);
            });

            const colors = { 1: '#48CAE4', 2: '#90E0EF', 3: '#ADE8F4', 4: '#48CAE4' };
            const lineColor = colors[activeKPI];

            const ctx = document.getElementById('trendChart').getContext('2d');
            if(kpiChart) { kpiChart.destroy(); }

            kpiChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: kpiDetails[activeKPI].title,
                        data: dataPoints,
                        borderColor: lineColor, 
                        backgroundColor: 'rgba(255,255,255,0.05)', 
                        borderWidth: 4,
                        tension: 0.4, // Smooth curve
                        fill: true,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: lineColor,
                        pointRadius: 5,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 1800, 
                        easing: 'easeOutQuart'
                    },
                    scales: {
                        y: { 
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }, 
                            ticks: { color: 'rgba(255, 255, 255, 0.7)' },
                            beginAtZero: true
                        },
                        x: { 
                            grid: { display: false }, 
                            ticks: { color: 'rgba(255, 255, 255, 0.7)' } 
                        }
                    },
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(3, 4, 94, 0.9)',
                            titleFont: { size: 14 },
                            bodyFont: { size: 14, weight: 'bold' },
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        // Full Screen Functionality
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.getElementById('fsBtn').innerHTML = "⛶ Full Screen";
            } else {
                document.getElementById('fsBtn').innerHTML = "⬅ Exit Full Screen";
            }
        });

        // Mouse Wheel Scroll Functionality for Sidebar
        let isScrolling = false;
        window.addEventListener('wheel', (e) => {
            if (isScrolling) return; 
            
            let nextId = activeKPI;
            if (e.deltaY > 0) { 
                nextId = activeKPI < 4 ? activeKPI + 1 : 1; 
            } else if (e.deltaY < 0) { 
                nextId = activeKPI > 1 ? activeKPI - 1 : 4;
            }

            if (nextId !== activeKPI) {
                isScrolling = true;
                const nextElement = document.querySelector(`.menu-item[data-kpi="${nextId}"]`);
                selectKPI(nextId, nextElement);
                
                setTimeout(() => { isScrolling = false; }, 800); 
            }
        });

        // Start Application
        initData();

    </script>
</body>
</html>
