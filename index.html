<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMO Dashboard</title>
    <!-- CSS for beautiful UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-blue-900">Live Business KPI Dashboard</h1>
            <span id="lastUpdated" class="text-sm font-semibold text-gray-600 bg-white px-4 py-2 rounded-lg shadow">Updating...</span>
        </div>

        <!-- KPI Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            
            <div class="bg-white p-6 rounded-xl shadow-lg border-l-4 border-red-500">
                <h3 class="text-gray-500 font-bold mb-1">Rep Variance</h3>
                <p id="var-rep" class="text-sm text-gray-400 mb-2">Rep Name: Loading...</p>
                <p id="var-amount" class="text-2xl font-bold text-gray-800">Rs. 0</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-lg border-l-4 border-orange-500">
                <h3 class="text-gray-500 font-bold mb-1">Sales Return</h3>
                <p id="sales-ret-rep" class="text-sm text-gray-400 mb-2">Rep Name: Loading...</p>
                <p id="sales-ret-amount" class="text-2xl font-bold text-gray-800">Rs. 0</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-lg border-l-4 border-blue-500">
                <h3 class="text-gray-500 font-bold mb-1">Issued Qty</h3>
                <p id="issued-rep" class="text-sm text-gray-400 mb-2">Rep Name: Loading...</p>
                <p id="issued-amount" class="text-2xl font-bold text-gray-800">0</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-lg border-l-4 border-purple-500">
                <h3 class="text-gray-500 font-bold mb-1">Shop Return</h3>
                <p id="shop-ret-rep" class="text-sm text-gray-400 mb-2">Rep Name: Loading...</p>
                <p id="shop-ret-amount" class="text-2xl font-bold text-gray-800">Rs. 0</p>
            </div>
        </div>
    </div>

    <!-- JavaScript Data Ganna Kotasa -->
    <script>
        // Oyage CSV links 4
        const URL_REP_VARIANCE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhXYa1mHKdqGCAI5xwLIZG62RUsnUVlE9V93tXkzBjWaFZ1Gwhyz0vJRrMgUFwaZ0zzNGGMZkeP9jd/pub?gid=1628331196&single=true&output=csv';
        const URL_SALES_RETURN = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhXYa1mHKdqGCAI5xwLIZG62RUsnUVlE9V93tXkzBjWaFZ1Gwhyz0vJRrMgUFwaZ0zzNGGMZkeP9jd/pub?gid=287547461&single=true&output=csv';
        const URL_ISSUED_QTY   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhXYa1mHKdqGCAI5xwLIZG62RUsnUVlE9V93tXkzBjWaFZ1Gwhyz0vJRrMgUFwaZ0zzNGGMZkeP9jd/pub?gid=957766558&single=true&output=csv';
        const URL_SHOP_RETURN  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhXYa1mHKdqGCAI5xwLIZG62RUsnUVlE9V93tXkzBjWaFZ1Gwhyz0vJRrMgUFwaZ0zzNGGMZkeP9jd/pub?gid=856858213&single=true&output=csv';

        const REFRESH_INTERVAL = 5000; // Thathpara 5n 5ta update wenna

        function parseCSV(csvText) {
            const rows = csvText.split('\n').map(row => row.split(','));
            return rows.slice(1).filter(row => row.length > 1); 
        }

        async function fetchRealTimeData() {
            try {
                const timestamp = '&t=' + new Date().getTime(); 

                const [resVariance, resSalesRet, resIssued, resShopRet] = await Promise.all([
                    fetch(URL_REP_VARIANCE + timestamp),
                    fetch(URL_SALES_RETURN + timestamp),
                    fetch(URL_ISSUED_QTY + timestamp),
                    fetch(URL_SHOP_RETURN + timestamp)
                ]);

                const dataVariance = parseCSV(await resVariance.text());
                const dataSalesRet = parseCSV(await resSalesRet.text());
                const dataIssued   = parseCSV(await resIssued.text());
                const dataShopRet  = parseCSV(await resShopRet.text());

                // Rep Variance (Anthima Row eka ganeema)
                if(dataVariance.length > 0) {
                    const latest = dataVariance[dataVariance.length - 1]; 
                    document.getElementById('var-rep').innerText = "Rep Name: " + latest[2];
                    document.getElementById('var-amount').innerText = "Rs. " + latest[3];
                }

                // Sales Return
                if(dataSalesRet.length > 0) {
                    const latest = dataSalesRet[dataSalesRet.length - 1]; 
                    document.getElementById('sales-ret-rep').innerText = "Rep Name: " + latest[2];
                    document.getElementById('sales-ret-amount').innerText = "Rs. " + latest[3];
                }

                // Issued Qty
                if(dataIssued.length > 0) {
                    const latest = dataIssued[dataIssued.length - 1]; 
                    document.getElementById('issued-rep').innerText = "Rep Name: " + latest[2];
                    document.getElementById('issued-amount').innerText = latest[3];
                }

                // Shop Return
                if(dataShopRet.length > 0) {
                    const latest = dataShopRet[dataShopRet.length - 1]; 
                    document.getElementById('shop-ret-rep').innerText = "Rep Name: " + latest[2];
                    document.getElementById('shop-ret-amount').innerText = "Rs. " + latest[3];
                }

                const now = new Date();
                document.getElementById('lastUpdated').innerText = "Last Updated: " + now.toLocaleTimeString();

            } catch (error) {
                console.error('Data loading error:', error);
                document.getElementById('lastUpdated').innerText = "Error Loading Data!";
            }
        }

        // Mulinma load weddi data genna ganeema
        fetchRealTimeData();
        
        // Thathpara 5n 5ta auto update kirima
        setInterval(fetchRealTimeData, REFRESH_INTERVAL);
    </script>
</body>
</html>
